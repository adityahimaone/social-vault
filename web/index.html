<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F2ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151D20" media="(prefers-color-scheme: dark)" />
    <title>Social Vault — Personal Bookmark Archive</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sv_theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // ignore storage restrictions
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
