<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Single allowed gradient: soft top-left white-to-transparent glass sheen -->
    <linearGradient id="glass-sheen" x1="12" y1="8" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Outer Graphite Ink Vault Dial Base (cx=32, cy=28, r=24 -> x=8..56, y=4..52 on 4px grid) -->
  <circle cx="32" cy="28" r="24" fill="#202929" />

  <!-- Outer Metallic Graphite Track (r=19.5..22.8) + Thin Concentric Ring Divider (r=21.2) -->
  <circle cx="32" cy="28" r="22.8" fill="#E4EFEB" fill-opacity="0.22" />
  <circle cx="32" cy="28" r="21.2" stroke="#202929" stroke-width="0.7" />
  <circle cx="32" cy="28" r="19.5" fill="#202929" />

  <!-- Mid Metallic Graphite Track (r=14.6..18.6) + Thin Concentric Ring & Bevel (r=16.6) -->
  <circle cx="32" cy="28" r="18.6" fill="#E4EFEB" fill-opacity="0.16" />
  <circle cx="32" cy="28" r="17.1" stroke="#E4EFEB" stroke-opacity="0.22" stroke-width="0.45" />
  <circle cx="32" cy="28" r="16.6" stroke="#202929" stroke-width="0.75" />
  <circle cx="32" cy="28" r="14.6" fill="#202929" />

  <!-- Inner Double Concentric Precision Rings (r=13.4 and r=12.1) surrounding Deep Graphite Chamber -->
  <circle cx="32" cy="28" r="13.4" stroke="#E4EFEB" stroke-opacity="0.26" stroke-width="0.7" />
  <circle cx="32" cy="28" r="12.1" stroke="#E4EFEB" stroke-opacity="0.24" stroke-width="0.7" />
  <circle cx="32" cy="28" r="11.4" fill="#202929" />

  <!-- Top-Left Diagonal Glass Sheen across the Vault Dial (r=22.8 chord from 8 o'clock to 1:30) -->
  <path
    d="M11.06 37.07A22.8 22.8 0 0 1 46.28 10.22L11.06 37.07Z"
    fill="url(#glass-sheen)"
  />

  <!-- Sage Focus Bookmark Ribbon hanging from Central Hub with 45-deg V-Notch (x=26..38, y=28..60) -->
  <path d="M26 28H38V60L32 54L26 60V28Z" fill="#557B79" />

  <!-- Central Vault Dial Hub (cx=32, cy=28, r=6, tangent to the 12px ribbon) -->
  <circle cx="32" cy="28" r="6" fill="#202929" />
  <circle cx="32" cy="28" r="5.65" stroke="#E4EFEB" stroke-opacity="0.34" stroke-width="0.7" />

  <!-- Inner Dial Spindle Cap (r=3.5) + Top-Left Hub Sheen + 12-o'clock Indicator Slot -->
  <circle cx="32" cy="28" r="3.5" fill="#E4EFEB" fill-opacity="0.26" />
  <path
    d="M27.35 30.72A5.3 5.3 0 0 1 35.65 24.16L27.35 30.72Z"
    fill="url(#glass-sheen)"
  />
  <rect x="31.4" y="24.2" width="1.2" height="4.2" rx="0.6" fill="#202929" />
</svg>
