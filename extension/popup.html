<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Social Vault</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-page">
    <main class="popup-shell">
      <header class="top-bar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 3a2 2 0 0 0-2 2v16l8-4 8 4V5a2 2 0 0 0-2-2H6z" />
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Social Vault</h1>
            <p class="brand-subtitle" id="vault-host-label">vault.adityahimaone.space</p>
          </div>
        </div>
        <button
          type="button"
          id="open-options-btn"
          class="btn btn-ghost btn-icon"
          aria-label="Open extension settings"
          title="Settings"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <div id="setup-banner" class="banner banner-info hidden" role="status">
        <div class="banner-body">
          <svg class="banner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
          <div class="banner-text">
            <span class="banner-title">API key needed</span>
            <span class="banner-meta">Add your VAULT_API_KEY in Settings before saving links.</span>
          </div>
        </div>
        <div class="banner-actions">
          <button type="button" id="setup-settings-btn" class="btn btn-secondary btn-sm">Settings</button>
        </div>
      </div>

      <div id="permission-banner" class="banner banner-info hidden" role="status">
        <div class="banner-body">
          <svg class="banner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <div class="banner-text">
            <span class="banner-title">Site access needed</span>
            <span class="banner-meta" id="permission-banner-text">Allow this extension to reach your custom Vault URL.</span>
          </div>
        </div>
        <div class="banner-actions">
          <button type="button" id="grant-permission-btn" class="btn btn-secondary btn-sm">Allow</button>
        </div>
      </div>

      <form id="save-form" class="form-stack" novalidate>
        <div class="field">
          <label class="field-label" for="bookmark-url">URL</label>
          <input
            id="bookmark-url"
            name="url"
            type="url"
            class="input input-mono"
            placeholder="https://example.com/article"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <p id="bookmark-url-error" class="field-error hidden" role="alert"></p>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="bookmark-title">Title</label>
            <span class="field-optional">Auto-fetched if empty</span>
          </div>
          <input
            id="bookmark-title"
            name="title"
            type="text"
            class="input"
            placeholder="Page title"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="bookmark-tags">Tags</label>
            <span class="field-optional">Comma-separated</span>
          </div>
          <input
            id="bookmark-tags"
            name="tags"
            type="text"
            class="input"
            placeholder="threads, reading, golang"
            autocomplete="off"
          />
          <div id="tag-preview" class="tag-preview hidden" aria-live="polite"></div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="bookmark-notes">Notes</label>
            <span class="field-optional">Optional</span>
          </div>
          <textarea
            id="bookmark-notes"
            name="notes"
            class="textarea"
            placeholder="Why you saved this link..."
          ></textarea>
        </div>

        <div id="status-banner" class="banner hidden" role="status" aria-live="polite"></div>

        <button type="submit" id="save-btn" class="btn btn-primary btn-block">
          <span id="save-btn-spinner" class="spinner hidden" aria-hidden="true"></span>
          <span id="save-btn-label">Save to Vault</span>
        </button>
      </form>

      <footer class="popup-footer">
        <a id="open-vault-link" href="https://vault.adityahimaone.space" target="_blank" rel="noreferrer">Open Vault</a>
        <span>Shortcut: <kbd class="kbd">⌘/Ctrl</kbd> + <kbd class="kbd">Enter</kbd></span>
      </footer>
    </main>

    <script src="vault-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
